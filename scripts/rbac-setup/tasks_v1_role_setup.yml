---
# Included once per role from tasks_v1_per_user.yml
# Variables available: role (from loop), user, username, group_uuid,
#                      group_name, auth_header, rbac_v1_base, proxy_env,
#                      api_retries, api_delay

# --- Look up or create role ---

- name: "Set custom role name"
  ansible.builtin.set_fact:
    role_name_custom: "test-role-{{ user.suffix }}-{{ role.permission | replace(':', '-') | replace('*', 'all') }}"
  when: role.type == 'custom'

- name: "Look up pre-configured role '{{ role.role_name | default('N/A') }}'"
  ansible.builtin.uri:
    url: "{{ rbac_v1_base }}/roles/?name={{ role.role_name | urlencode }}"
    method: GET
    headers: "{{ auth_header }}"
    status_code: 200
  environment: "{{ proxy_env }}"
  register: preconfigured_role_lookup
  retries: "{{ api_retries }}"
  delay: "{{ api_delay }}"
  until: preconfigured_role_lookup is not failed
  when: role.type == 'preconfigured'

- name: "Fail if pre-configured role '{{ role.role_name | default('N/A') }}' not found"
  ansible.builtin.fail:
    msg: "Pre-configured role '{{ role.role_name }}' not found in RBAC. Available roles may differ by environment."
  when:
    - role.type == 'preconfigured'
    - preconfigured_role_lookup.json.meta.count == 0

- name: "Check if custom role '{{ role_name_custom | default('N/A') }}' exists"
  ansible.builtin.uri:
    url: "{{ rbac_v1_base }}/roles/?name={{ role_name_custom | urlencode }}"
    method: GET
    headers: "{{ auth_header }}"
    status_code: 200
  environment: "{{ proxy_env }}"
  register: custom_role_lookup
  retries: "{{ api_retries }}"
  delay: "{{ api_delay }}"
  until: custom_role_lookup is not failed
  when: role.type == 'custom'

- name: "Create custom role '{{ role_name_custom | default('N/A') }}'"
  ansible.builtin.uri:
    url: "{{ rbac_v1_base }}/roles/"
    method: POST
    headers: "{{ auth_header }}"
    body_format: json
    body:
      name: "{{ role_name_custom }}"
      description: "Test role for {{ role.permission }} permission"
      access:
        - permission: "{{ role.permission }}"
          resourceDefinitions: []
      applications:
        - "{{ role.permission.split(':')[0] }}"
    status_code: [200, 201]
  environment: "{{ proxy_env }}"
  register: custom_role_created
  retries: "{{ api_retries }}"
  delay: "{{ api_delay }}"
  until: custom_role_created is not failed
  when:
    - role.type == 'custom'
    - custom_role_lookup.json.meta.count == 0

- name: "Set role UUID"
  ansible.builtin.set_fact:
    role_uuid: >-
      {%- if role.type == 'preconfigured' -%}
        {{ preconfigured_role_lookup.json.data[0].uuid }}
      {%- elif role.type == 'custom' and custom_role_lookup.json.meta.count > 0 -%}
        {{ custom_role_lookup.json.data[0].uuid }}
      {%- else -%}
        {{ custom_role_created.json.uuid }}
      {%- endif -%}

# --- Add role to group ---

- name: "List roles in group '{{ group_name }}'"
  ansible.builtin.uri:
    url: "{{ rbac_v1_base }}/groups/{{ group_uuid }}/roles/"
    method: GET
    headers: "{{ auth_header }}"
    status_code: 200
  environment: "{{ proxy_env }}"
  register: group_roles
  retries: "{{ api_retries }}"
  delay: "{{ api_delay }}"
  until: group_roles is not failed

- name: "Add role to group '{{ group_name }}'"
  ansible.builtin.uri:
    url: "{{ rbac_v1_base }}/groups/{{ group_uuid }}/roles/"
    method: POST
    headers: "{{ auth_header }}"
    body_format: json
    body:
      roles:
        - "{{ role_uuid }}"
    status_code: [200, 201]
  environment: "{{ proxy_env }}"
  register: role_added
  retries: "{{ api_retries }}"
  delay: "{{ api_delay }}"
  until: role_added is not failed
  when: role_uuid not in (group_roles.json.data | map(attribute='uuid') | list)
