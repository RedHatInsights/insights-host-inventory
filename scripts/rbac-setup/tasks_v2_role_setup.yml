---
# Included once per role from tasks_v2_per_user.yml
# Variables available: role (from loop), user, username, group_uuid,
#                      auth_header, rbac_v1_base, rbac_v2_base, proxy_env,
#                      workspace_ids, api_retries, api_delay

# --- Look up or create role (via v2 API) ---

- name: "Set v2 role name"
  ansible.builtin.set_fact:
    v2_role_name: "{{ role.role_name_v2 | default(role.role_name) }}"
  when: role.type == 'preconfigured'

- name: "Set custom role name"
  ansible.builtin.set_fact:
    role_name_custom: "test-role-{{ user.suffix }}-{{ role.permission | replace(':', '-') | replace('*', 'all') }}"
  when: role.type == 'custom'

- name: "Look up pre-configured role '{{ v2_role_name | default('N/A') }}' via v2"
  ansible.builtin.uri:
    url: "{{ rbac_v2_base }}/roles/?name={{ v2_role_name | urlencode }}&limit=100"
    method: GET
    headers: "{{ auth_header }}"
    status_code: 200
  environment: "{{ proxy_env }}"
  register: preconfigured_role_lookup_v2
  retries: "{{ api_retries }}"
  delay: "{{ api_delay }}"
  until: preconfigured_role_lookup_v2 is not failed
  when: role.type == 'preconfigured'

- name: "Fail if pre-configured role '{{ v2_role_name | default('N/A') }}' not found"
  ansible.builtin.fail:
    msg: "Pre-configured role '{{ v2_role_name }}' not found in RBAC v2."
  when:
    - role.type == 'preconfigured'
    - preconfigured_role_lookup_v2.json.data | length == 0

- name: "Check if custom role '{{ role_name_custom | default('N/A') }}' exists in v2"
  ansible.builtin.uri:
    url: "{{ rbac_v2_base }}/roles/?name={{ role_name_custom | urlencode }}&limit=10"
    method: GET
    headers: "{{ auth_header }}"
    status_code: 200
  environment: "{{ proxy_env }}"
  register: custom_role_lookup_v2
  retries: "{{ api_retries }}"
  delay: "{{ api_delay }}"
  until: custom_role_lookup_v2 is not failed
  when: role.type == 'custom'

- name: "Create custom role '{{ role_name_custom | default('N/A') }}' via v2"
  ansible.builtin.uri:
    url: "{{ rbac_v2_base }}/roles/"
    method: POST
    headers: "{{ auth_header }}"
    body_format: json
    body:
      name: "{{ role_name_custom }}"
      description: "Test role for {{ role.permission }} permission"
      permissions:
        - application: "{{ role.permission.split(':')[0] }}"
          resource_type: "{{ role.permission.split(':')[1] }}"
          operation: "{{ role.permission.split(':')[2] }}"
    status_code: [200, 201]
  environment: "{{ proxy_env }}"
  register: custom_role_created_v2
  retries: "{{ api_retries }}"
  delay: "{{ api_delay }}"
  until: custom_role_created_v2 is not failed
  when:
    - role.type == 'custom'
    - custom_role_lookup_v2.json.data | length == 0

- name: "Set role ID (v2 uses 'id' not 'uuid')"
  ansible.builtin.set_fact:
    role_id: >-
      {%- if role.type == 'preconfigured' -%}
        {{ preconfigured_role_lookup_v2.json.data[0].id }}
      {%- elif role.type == 'custom' and custom_role_lookup_v2.json.data | length > 0 -%}
        {{ custom_role_lookup_v2.json.data[0].id }}
      {%- else -%}
        {{ custom_role_created_v2.json.id }}
      {%- endif -%}

# --- Create role binding (v2) ---

- name: "Set target workspace ID"
  ansible.builtin.set_fact:
    target_workspace_id: "{{ workspace_ids[role.workspace_type] }}"

- name: "Check existing role bindings for group"
  ansible.builtin.uri:
    url: "{{ rbac_v2_base }}/role-bindings/?subject_type=group&subject_id={{ group_uuid }}&limit=100"
    method: GET
    headers: "{{ auth_header }}"
    status_code: 200
  environment: "{{ proxy_env }}"
  register: existing_bindings
  retries: "{{ api_retries }}"
  delay: "{{ api_delay }}"
  until: existing_bindings is not failed

- name: "Check if correct binding already exists"
  ansible.builtin.set_fact:
    binding_exists: >-
      {{ existing_bindings.json.data | selectattr('role.id', 'equalto', role_id)
         | selectattr('resource.id', 'equalto', target_workspace_id) | list | length > 0 }}

- name: "Create role binding for {{ username }}"
  ansible.builtin.uri:
    url: "{{ rbac_v2_base }}/role-bindings:batchCreate/"
    method: POST
    headers: "{{ auth_header }}"
    body_format: json
    body:
      requests:
        - role:
            id: "{{ role_id }}"
          resource:
            id: "{{ target_workspace_id }}"
            type: "workspace"
          subject:
            id: "{{ group_uuid }}"
            type: "group"
    status_code: [200, 201]
  environment: "{{ proxy_env }}"
  retries: "{{ api_retries }}"
  delay: "{{ api_delay }}"
  until: role_binding_created is not failed
  register: role_binding_created
  when: not binding_exists
