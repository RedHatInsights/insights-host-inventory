default:
  hbi_api_base_path: /api/inventory/v1
  ingress_api_base_path: /api/ingress/v1
  http:
    default_auth_type: jwt
    headers:
      Content-Type: application/json

stage:
  default_user: insights_inventory_qe
  users:
    insights_inventory_qe:
      auth:
        basic:
          username: !from_vault {path: secrets/qe/stage/users/insights_inventory_qe, key: username}
          password: !from_vault {path: secrets/qe/stage/users/insights_inventory_qe, key: password}
        jwt:
          refresh_token: !from_vault {path: secrets/qe/stage/users/insights_inventory_qe, key: refresh_token}
          grant_type: refresh_token
        cert:
          cert: !from_vault {path: secrets/qe/stage/users/insights_inventory_qe, key: cert}
          key: !from_vault {path: secrets/qe/stage/users/insights_inventory_qe, key: key}

prod:
  default_user: insights_inventory_qe
  users:
    insights_inventory_qe:
      auth:
        basic:
          username: !from_vault {path: secrets/qe/prod/users/insights_inventory_qe, key: username}
          password: !from_vault {path: secrets/qe/prod/users/insights_inventory_qe, key: password}

ephemeral:
  default_user: insights_inventory_qe
  http:
    default_auth_type: jwt
  users:
    insights_inventory_qe:
      auth:
        basic:
          username: &primary-user-username insights_inventory_qe
          password: &primary-user-password some_password
        jwt:
          grant_type: password
          username: *primary-user-username
          password: *primary-user-password
          scope: openid
      attributes:
        type: User
        account_number: &primary-user-account "012345"
        org_id: &primary-user-org "12345"
        user_id: "123451"
        email: insights_inventory_qe@example.com
        first_name: Insights
        last_name: Inventory
        is_active: true
        is_org_admin: true
        is_internal: false
        locale: en_US
      entitlements:
        hybrid_cloud:
          is_entitled: true
        insights:
          is_entitled: true
        openshift:
          is_entitled: true
        smart_management:
          is_entitled: true
        cost_management:
          is_entitled: true
        settings:
          is_entitled: true
