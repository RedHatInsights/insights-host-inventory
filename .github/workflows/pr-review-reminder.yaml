# Posts a daily Slack reminder listing open PRs (older than 1 day) that still need
# review attention (fewer than 2 human approvals, or no human review/comment
# activity in the last 24 hours), and collects PR health metrics to a GitHub Pages
# dashboard.

name: PR Review Reminder

on:
  schedule:
    # Every weekday (Mon-Fri) at 14:00 UTC (~9 AM US Eastern)
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip Slack post and just log output'
        required: false
        type: boolean
        default: false

permissions:
  pull-requests: read

# Accounts whose reviews/comments should not count as "human activity."
# Add new bot/app accounts here to prevent their automated comments from
# hiding PRs in the daily reminder. This does NOT exclude PRs authored
# by these accounts — those still appear if they need review.
env:
  BOT_PATTERN: "^(dependabot\\[bot\\]|red-hat-konflux\\[bot\\]|github-actions\\[bot\\]|sourcery-ai\\[bot\\]|sourcery-ai|insights-inventory-bot|failure-analysis|bugkiller-agent)$"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch and post unreviewed PRs to Slack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          NOW=$(date -u +%s)
          ONE_DAY=86400

          PRS=$(gh pr list \
            --state open \
            --json number,title,author,createdAt,url,isDraft,reviewDecision,reviews,comments \
            --limit 100)

          FILTERED=$(echo "$PRS" | jq --argjson now "$NOW" --argjson day "$ONE_DAY" --arg bots "$BOT_PATTERN" '
            [ .[]
              | select(.isDraft == false)
              | .author.login as $pr_author
              | select(([.reviews[] | select(.author.login != $pr_author and (.author.login | test($bots) | not)) | select(.submittedAt != null and ($now - (.submittedAt | fromdateiso8601)) <= $day)] | length) == 0)
              | select(([.comments[] | select(.author.login != $pr_author and (.author.login | test($bots) | not)) | select(($now - (.createdAt | fromdateiso8601)) <= $day)] | length) == 0)
              | select(.reviewDecision != "CHANGES_REQUESTED")
              | select(([.reviews[] | select(.state == "APPROVED" and .author.login != $pr_author and (.author.login | test($bots) | not)) | .author.login] | unique | length) < 2)
              | (.createdAt | fromdateiso8601) as $created
              | select(($now - $created) > $day)
              | . + { age_days: (($now - $created) / $day | floor) }
            ]
            | sort_by(-.age_days)
          ')

          COUNT=$(echo "$FILTERED" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "No open PRs older than 1 day with no human review/comment activity in the last 24 hours. Skipping Slack notification."
            exit 0
          fi

          DAY_NAME=$(date -u +%A)

          escape_mrkdwn() { echo "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }

          LINES=""
          INDEX=1
          while IFS= read -r pr; do
            NUMBER=$(echo "$pr" | jq -r '.number')
            TITLE=$(escape_mrkdwn "$(echo "$pr" | jq -r '.title')")
            AUTHOR=$(escape_mrkdwn "$(echo "$pr" | jq -r '.author.login')")
            URL=$(echo "$pr" | jq -r '.url')
            AGE=$(echo "$pr" | jq -r '.age_days')
            LINES+="${INDEX}. <${URL}|#${NUMBER} — ${TITLE}> (by @${AUTHOR}) — *${AGE} days old*"$'\n'
            INDEX=$((INDEX + 1))
          done < <(echo "$FILTERED" | jq -c '.[]')

          PAYLOAD=$(jq -n \
            --arg header ":eyes: *Backend PR Review Reminder ($DAY_NAME)* — $COUNT PR(s) awaiting review" \
            --arg body "$LINES" \
            '{
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: $header } },
                { type: "divider" },
                { type: "section", text: { type: "mrkdwn", text: $body } }
              ]
            }')

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — would have posted to Slack:"
            echo "$PAYLOAD" | jq .
          else
            curl -sf -X POST \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$SLACK_WEBHOOK_URL"
            echo "Slack reminder sent with $COUNT PR(s)."
          fi

  metrics:
    runs-on: ubuntu-latest
    needs: notify
    if: always()
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      STALE_DEPLOY_DATE: "2026-02-17"
      REVIEW_DEPLOY_DATE: "2026-04-01"
      BASELINE_DAYS: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup gh-pages branch
        run: |
          # Fetch gh-pages if it exists, or create an orphan branch
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            git checkout gh-pages -- data.json 2>/dev/null || echo '{}' > data.json
          else
            echo '{}' > data.json
          fi

      - name: Collect PR metrics
        id: collect
        run: |
          set -euo pipefail

          TODAY=$(date -u +%Y-%m-%d)
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          DATA_FILE="data.json"

          if [ ! -f "$DATA_FILE" ]; then
            echo '{}' > "$DATA_FILE"
          fi

          EXISTING=$(cat "$DATA_FILE")

          # Determine current quarter
          if [ "$MONTH" -le 3 ]; then
            QUARTER="Q1"; Q_START="${YEAR}-01-01"; Q_END="${YEAR}-03-31"
          elif [ "$MONTH" -le 6 ]; then
            QUARTER="Q2"; Q_START="${YEAR}-04-01"; Q_END="${YEAR}-06-30"
          elif [ "$MONTH" -le 9 ]; then
            QUARTER="Q3"; Q_START="${YEAR}-07-01"; Q_END="${YEAR}-09-30"
          else
            QUARTER="Q4"; Q_START="${YEAR}-10-01"; Q_END="${YEAR}-12-31"
          fi

          # For tools deployed mid-quarter, adjust start to deploy date
          STALE_Q_START="$Q_START"
          REVIEW_Q_START="$Q_START"
          if [[ "$STALE_DEPLOY_DATE" > "$Q_START" && "$STALE_DEPLOY_DATE" < "$Q_END" ]]; then
            STALE_Q_START="$STALE_DEPLOY_DATE"
          fi
          if [[ "$REVIEW_DEPLOY_DATE" > "$Q_START" && "$REVIEW_DEPLOY_DATE" < "$Q_END" ]]; then
            REVIEW_Q_START="$REVIEW_DEPLOY_DATE"
          fi

          # Use today as the end if quarter hasn't finished
          STALE_Q_END="$Q_END"
          REVIEW_Q_END="$Q_END"
          if [[ "$TODAY" < "$Q_END" ]]; then
            STALE_Q_END="$TODAY"
            REVIEW_Q_END="$TODAY"
          fi

          # Skip if tool wasn't deployed yet in this quarter
          SKIP_STALE="false"
          SKIP_REVIEW="false"
          if [[ "$STALE_DEPLOY_DATE" > "$STALE_Q_END" ]]; then
            SKIP_STALE="true"
          fi
          if [[ "$REVIEW_DEPLOY_DATE" > "$REVIEW_Q_END" ]]; then
            SKIP_REVIEW="true"
          fi

          echo "Year: $YEAR | Quarter: $QUARTER | Today: $TODAY"
          echo "Stale quarter: $STALE_Q_START..$STALE_Q_END (skip=$SKIP_STALE)"
          echo "Review quarter: $REVIEW_Q_START..$REVIEW_Q_END (skip=$SKIP_REVIEW)"

          # Year-end reset: if the stored year differs from current, wipe quarterly data
          STORED_YEAR=$(echo "$EXISTING" | jq -r '.year // ""')
          if [ "$STORED_YEAR" != "$YEAR" ]; then
            echo "New year detected ($STORED_YEAR -> $YEAR). Resetting quarterly data."
            EXISTING=$(echo "$EXISTING" | jq --arg y "$YEAR" '.year = $y | .quarters = {}')
          fi

          # jq function for computing metrics from a PR list
          COMPUTE_JQ='
            def to_epoch: sub("\\.[0-9]+"; "") | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime;
            def hours_between(a; b): ((b - a) / 3600 * 10 | floor) / 10;
            def median:
              sort | if length == 0 then null
              elif length % 2 == 1 then .[length/2 | floor]
              else (.[length/2 - 1] + .[length/2]) / 2 end;

            def is_bot_author: .author.login | test("^(app/|dependabot\\[bot\\]|red-hat-konflux\\[bot\\]|github-actions\\[bot\\]|sourcery-ai\\[bot\\]|sourcery-ai|insights-inventory-bot)");

            ($start | to_epoch) as $s |
            ($end | to_epoch) as $e |

            [ .[] | select(.isDraft == false)
              | select(is_bot_author | not)
              | (.createdAt | to_epoch) as $created
              | select($created >= $s and $created <= $e)
            ] as $prs |

            ($prs | length) as $total |
            [ $prs[] | select(.mergedAt != null) ] as $merged |
            [ $prs[] | select(.state == "CLOSED" and .mergedAt == null) ] as $closed_no_merge |
            [ $prs[] | select(.state == "OPEN") ] as $still_open |

            [ .[]
              | select(.state == "CLOSED" and .mergedAt == null)
              | select(any(.labels[]?; .name == "stale"))
              | select(.closedAt != null)
              | (.closedAt | to_epoch) as $closed
              | select($closed >= $s and $closed <= $e)
            ] as $bot_closed |

            [ $merged[]
              | (.createdAt | to_epoch) as $c
              | (.mergedAt | to_epoch) as $m
              | hours_between($c; $m)
            ] as $ttm |

            [ $prs[]
              | (.createdAt | to_epoch) as $c
              | [ .review_times[]? | to_epoch ] | sort | first // null
              | if . then hours_between($c; .) else null end
            ] | map(select(. != null)) as $ttfr |

            [ $prs[]
              | (.createdAt | to_epoch) as $c
              | select((.review_times | length) == 0)
              | select(($e - $c) > 86400)
            ] as $no_review_24h |

            [ $prs[]
              | (.createdAt | to_epoch) as $c
              | (if .closedAt then (.closedAt | to_epoch) else $e end) as $resolve
              | select(($resolve - $c) > (15 * 86400))
            ] as $open_15d |

            [ $prs[]
              | (.createdAt | to_epoch) as $c
              | [ .review_times[]? | to_epoch ] | sort | first // null
              | if . then (. - $c) else null end
            ] as $review_deltas |
            ([ $review_deltas[] | select(. != null and . <= 86400) ] | length) as $reviewed_24h |
            ([ $review_deltas[] | select(. != null) ] | length) as $reviewed_total |

            {
              total: $total,
              merged: ($merged | length),
              closed_no_merge: ($closed_no_merge | length),
              still_open: ($still_open | length),
              bot_closed: ($bot_closed | length),
              median_ttm: ($ttm | median),
              median_ttfr: ($ttfr | median),
              avg_ttfr: (if ($ttfr | length) > 0 then ($ttfr | add / length * 10 | floor) / 10 else null end),
              pct_reviewed_24h: (if $reviewed_total > 0 then (($reviewed_24h * 10000 / $reviewed_total | floor) / 100) else null end),
              no_review_24h: ($no_review_24h | length),
              open_15d: ($open_15d | length)
            }
          '

          compute_metrics() {
            local prs_file="$1" start_date="$2" end_date="$3"
            jq --arg start "${start_date}T00:00:00Z" --arg end "${end_date}T23:59:59Z" "$COMPUTE_JQ" < "$prs_file"
          }

          # --- BASELINE: compute once, store forever ---
          HAS_BASELINE=$(echo "$EXISTING" | jq 'has("baseline") and .baseline != null')
          BASELINE_PATCH=null

          if [ "$HAS_BASELINE" = "false" ]; then
            echo "Computing frozen baseline (${BASELINE_DAYS} days before each deploy date)..."

            stale_before_start=$(date -u -d "$STALE_DEPLOY_DATE - ${BASELINE_DAYS} days" +%Y-%m-%d)
            stale_before_end=$(date -u -d "$STALE_DEPLOY_DATE - 1 day" +%Y-%m-%d)
            review_before_start=$(date -u -d "$REVIEW_DEPLOY_DATE - ${BASELINE_DAYS} days" +%Y-%m-%d)
            review_before_end=$(date -u -d "$REVIEW_DEPLOY_DATE - 1 day" +%Y-%m-%d)

            echo "Stale baseline: $stale_before_start..$stale_before_end"
            echo "Review baseline: $review_before_start..$review_before_end"

            # Fetch PRs covering the baseline period (date-bounded at API level)
            gh pr list --repo "$REPO" --state all \
              --json number,createdAt,closedAt,mergedAt,isDraft,state,labels,author \
              --search "created:${stale_before_start}..${review_before_end}" \
              --limit 1000 > /tmp/prs_base.json

            if [ "$(jq 'length' /tmp/prs_base.json)" -ge 1000 ]; then
              echo "::warning::Baseline PR count hit 1000 limit for ${stale_before_start}..${review_before_end}. Metrics may be truncated."
            fi

            # Fetch reviews in monthly chunks to avoid GitHub GraphQL timeouts
            echo '[]' > /tmp/reviews_raw.json
            chunk_hit_limit=0
            chunk_start="$stale_before_start"
            while [[ "$chunk_start" < "$review_before_end" ]]; do
              chunk_end=$(date -u -d "$chunk_start + 30 days" +%Y-%m-%d)
              if [[ "$chunk_end" > "$review_before_end" ]]; then
                chunk_end="$review_before_end"
              fi
              echo "Fetching reviews for $chunk_start..$chunk_end..."
              gh pr list --repo "$REPO" --state all \
                --json number,reviews \
                --search "created:${chunk_start}..${chunk_end}" \
                --limit 500 > /tmp/reviews_chunk.json
              if [ "$(jq 'length' /tmp/reviews_chunk.json)" -ge 500 ]; then
                chunk_hit_limit=1
              fi
              jq -s '.[0] + .[1]' /tmp/reviews_raw.json /tmp/reviews_chunk.json > /tmp/reviews_tmp.json
              mv /tmp/reviews_tmp.json /tmp/reviews_raw.json
              chunk_start=$(date -u -d "$chunk_end + 1 day" +%Y-%m-%d)
            done
            echo "Fetched reviews for $(jq 'length' /tmp/reviews_raw.json) PRs total."
            if [ "$chunk_hit_limit" -eq 1 ]; then
              echo "::warning::Baseline review data may be truncated: at least one chunk hit the 500 PR per-call limit."
            fi

            jq --arg bots "$BOT_PATTERN" \
              '[.[] | {number, review_times: [.reviews[]? | select(.author.login | test($bots) | not) | .submittedAt]}]' \
              /tmp/reviews_raw.json > /tmp/reviews_filtered.json
            jq -s '.[0] as $base | .[1] as $reviews |
              ($reviews | map({(.number | tostring): .review_times}) | add // {}) as $rmap |
              [$base[] | . + {review_times: ($rmap[.number | tostring] // [])}]
            ' /tmp/prs_base.json /tmp/reviews_filtered.json > /tmp/baseline_prs.json

            STALE_BASELINE=$(compute_metrics "/tmp/baseline_prs.json" "$stale_before_start" "$stale_before_end")
            REVIEW_BASELINE=$(compute_metrics "/tmp/baseline_prs.json" "$review_before_start" "$review_before_end")

            EXISTING=$(echo "$EXISTING" | jq \
              --argjson sb "$STALE_BASELINE" \
              --argjson rb "$REVIEW_BASELINE" \
              --arg sbp "$stale_before_start to $stale_before_end" \
              --arg rbp "$review_before_start to $review_before_end" \
              --arg y "$YEAR" \
              '. + {
                year: $y,
                baseline: {
                  stale: { period: $sbp, data: $sb },
                  review: { period: $rbp, data: $rb }
                },
                quarters: (.quarters // {})
              }')
            BASELINE_PATCH=$(echo "$EXISTING" | jq -c '.baseline')

            echo "Baseline computed and stored."
          else
            echo "Baseline already exists. Skipping."
          fi

          # --- QUARTERLY DATA: fetch current quarter only ---
          echo "Fetching PRs for current quarter ($QUARTER)..."

          gh pr list --repo "$REPO" --state all \
            --json number,createdAt,closedAt,mergedAt,isDraft,state,labels,author \
            --search "created:${Q_START}..${Q_END}" \
            --limit 1000 > /tmp/q_prs_base.json

          gh pr list --repo "$REPO" --state all \
            --json number,reviews \
            --search "created:${Q_START}..${Q_END}" \
            --limit 1000 > /tmp/q_reviews_raw.json

          jq --arg bots "$BOT_PATTERN" \
            '[.[] | {number, review_times: [.reviews[]? | select(.author.login | test($bots) | not) | .submittedAt]}]' \
            /tmp/q_reviews_raw.json > /tmp/q_reviews_filtered.json

          jq -s '.[0] as $base | .[1] as $reviews |
            ($reviews | map({(.number | tostring): .review_times}) | add // {}) as $rmap |
            [$base[] | . + {review_times: ($rmap[.number | tostring] // [])}]
          ' /tmp/q_prs_base.json /tmp/q_reviews_filtered.json > /tmp/q_prs.json

          echo "Fetched $(jq 'length' /tmp/q_prs.json) PRs for $QUARTER."

          # Fetch bot-closed count separately (PRs closed during quarter, regardless of creation date)
          BOT_CLOSED_COUNT=0
          if [ "$SKIP_STALE" = "false" ]; then
            BOT_CLOSED_COUNT=$(gh pr list --repo "$REPO" --state closed \
              --json number \
              --search "label:stale closed:${STALE_Q_START}..${STALE_Q_END} -is:merged" \
              --limit 1000 | jq 'length')
            echo "Bot-closed PRs in $QUARTER: $BOT_CLOSED_COUNT"
          fi

          # Compute quarterly metrics
          QUARTER_ENTRY=$(jq -n --arg q "$QUARTER" --arg date "$TODAY" '{ quarter: $q, updated: $date }')

          if [ "$SKIP_STALE" = "false" ]; then
            STALE_Q=$(compute_metrics "/tmp/q_prs.json" "$STALE_Q_START" "$STALE_Q_END")
            STALE_Q=$(echo "$STALE_Q" | jq --argjson bc "$BOT_CLOSED_COUNT" '.bot_closed = $bc')
            QUARTER_ENTRY=$(echo "$QUARTER_ENTRY" | jq \
              --argjson data "$STALE_Q" \
              --arg period "$STALE_Q_START to $STALE_Q_END" \
              '. + { stale: { period: $period, data: $data } }')
          fi

          if [ "$SKIP_REVIEW" = "false" ]; then
            REVIEW_Q=$(compute_metrics "/tmp/q_prs.json" "$REVIEW_Q_START" "$REVIEW_Q_END")
            QUARTER_ENTRY=$(echo "$QUARTER_ENTRY" | jq \
              --argjson data "$REVIEW_Q" \
              --arg period "$REVIEW_Q_START to $REVIEW_Q_END" \
              '. + { review: { period: $period, data: $data } }')
          fi

          echo "$QUARTER_ENTRY" | jq .

          # Upsert the quarter into data
          EXISTING=$(echo "$EXISTING" | jq \
            --arg q "$QUARTER" \
            --argjson entry "$QUARTER_ENTRY" \
            '.quarters[$q] = $entry')

          echo "$EXISTING" | jq . > "$DATA_FILE"
          cp "$DATA_FILE" /tmp/metrics_data.json

          # Persist this run's changes so the push step can re-apply them on
          # top of the latest gh-pages data.json (concurrent-run safety). The
          # year is captured at collection time: a run that straddles UTC
          # midnight on New Year's Eve must still file its quarter under the
          # year it was collected for, not whatever year it is at push time.
          jq -n \
            --arg y "$YEAR" \
            --arg q "$QUARTER" \
            --argjson entry "$QUARTER_ENTRY" \
            --argjson baseline "$BASELINE_PATCH" \
            '{year: $y, quarter: $q, entry: $entry} + (if $baseline != null then {baseline: $baseline} else {} end)' \
            > /tmp/metrics_patch.json

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Push to gh-pages branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)

          if [ ! -f /tmp/metrics_data.json ]; then
            echo "Error: /tmp/metrics_data.json not found. Metrics step may have failed."
            exit 1
          fi

          # Prepare index.html from the source branch
          INDEX_HTML=""
          if git show origin/master:docs/metrics/index.html > /tmp/index.html 2>/dev/null || \
             git show origin/main:docs/metrics/index.html > /tmp/index.html 2>/dev/null; then
            INDEX_HTML=$(base64 -w0 /tmp/index.html)
          fi

          DATA_JSON=$(base64 -w0 /tmp/metrics_data.json)

          # Build file additions via jq for correct JSON structure.
          # FileAddition.contents must be base64: the GraphQL schema types it
          # as Base64String and GitHub decodes it when creating the blob.
          build_additions() {
            local additions
            additions=$(jq -n --arg data "$1" '[{path: "data.json", contents: $data}]')
            if [ -n "$INDEX_HTML" ]; then
              additions=$(echo "$additions" | jq --arg html "$INDEX_HTML" '. + [{path: "index.html", contents: $html}]')
            fi
            echo "$additions"
          }

          ADDITIONS=$(build_additions "$DATA_JSON")

          # Best-effort bootstrap of gh-pages for repos that do not have the
          # branch yet. NOTE: this REST-created root commit is unsigned, so on
          # repos with a required-signatures ruleset (like this org's) the ref
          # creation is rejected — there is no API that creates a signed commit
          # on a branch that does not exist yet. In that case the branch must
          # be created once by hand (any verified commit), after which this
          # workflow maintains it.
          bootstrap_ghpages() {
            local tree_sha init_sha
            tree_sha=$(jq -n '{tree: [{path: ".gitkeep", mode: "100644", type: "blob", content: ""}]}' \
              | gh api "repos/$REPO/git/trees" --method POST --input - --jq '.sha') || return 1
            init_sha=$(jq -n --arg tree "$tree_sha" '{message: "init gh-pages", tree: $tree}' \
              | gh api "repos/$REPO/git/commits" --method POST --input - --jq '.sha') || return 1
            jq -n --arg sha "$init_sha" '{ref: "refs/heads/gh-pages", sha: $sha}' \
              | gh api "repos/$REPO/git/refs" --method POST --input - > /dev/null || return 1
            echo "$init_sha"
          }

          # Use createCommitOnBranch to produce a verified commit (with retry for races).
          # The org ruleset requires signed commits, and plain `git push` of an
          # unsigned github-actions[bot] commit is rejected (GH013). Commits
          # created through the API as the bot carry GitHub's own signature.
          for attempt in 1 2 3; do
            retry_reason=""

            BRANCH_SHA=$(gh api "repos/$REPO/git/ref/heads/gh-pages" --jq '.object.sha' 2>/dev/null || echo "")
            if [ -z "$BRANCH_SHA" ]; then
              if BOOT_SHA=$(bootstrap_ghpages); then
                BRANCH_SHA="$BOOT_SHA"
              else
                # Either the ruleset rejected the unsigned bootstrap commit or a
                # concurrent run created the branch first — re-read and retry.
                BRANCH_SHA=$(gh api "repos/$REPO/git/ref/heads/gh-pages" --jq '.object.sha' 2>/dev/null || echo "")
              fi
              if [ -z "$BRANCH_SHA" ]; then
                retry_reason="could not create gh-pages branch (if the org requires signed commits, create it once by hand with a verified commit)"
              fi
            fi

            # Re-apply this run's metrics onto the latest gh-pages data.json so
            # a concurrent run's newer numbers are not overwritten by this run's
            # earlier snapshot. Fetched after BRANCH_SHA on purpose: a commit
            # landing in between fails the expectedHeadOid check and is retried
            # with fresh state, so the merge can never race ahead of the SHA it
            # is validated against.
            if [ -z "$retry_reason" ]; then
              if CONTENTS=$(gh api "repos/$REPO/contents/data.json?ref=gh-pages" \
                  --jq '.content | gsub("\\n"; "")' 2>/tmp/ghpages_read_err.txt); then
                printf '%s' "$CONTENTS" | base64 -d > /tmp/ghpages_data.json
                # Merge rules, most specific first:
                # - inject the baseline only if gh-pages does not have one yet;
                # - a patch from a newer year rolls the data over to that year;
                # - a patch from an older year is obsolete (the year-end rollover
                #   already dropped its quarters) and is discarded entirely;
                # - within the same year, a quarter entry is only replaced when
                #   the patch's entry is at least as recent (by `updated` date),
                #   so a delayed older run cannot revert a newer one.
                if MERGED=$(jq -n \
                    --rawfile fresh /tmp/ghpages_data.json \
                    --rawfile patch /tmp/metrics_patch.json \
                    '($fresh | fromjson) as $f | ($patch | fromjson) as $p
                     | $f
                     | (if ($p.baseline != null) and (.baseline == null) then .baseline = $p.baseline else . end)
                     | (if (($p.year // "0" | tonumber) > (.year // "0" | tonumber)) then
                         .year = $p.year | .quarters = {} | .quarters[$p.quarter] = $p.entry
                       elif .year == $p.year and
                            ((.quarters[$p.quarter] == null) or ((.quarters[$p.quarter].updated // "") <= ($p.entry.updated // ""))) then
                         .quarters[$p.quarter] = $p.entry
                       else . end)' 2>/dev/null) && [ -n "$MERGED" ]; then
                  ADDITIONS=$(build_additions "$(printf '%s' "$MERGED" | base64 -w0)")
                else
                  retry_reason="could not merge this run's metrics with the latest gh-pages data.json"
                fi
              elif grep -qE "Not Found|HTTP 404" /tmp/ghpages_read_err.txt; then
                # No data.json on gh-pages yet — nothing newer can be lost, so
                # this run's snapshot becomes the first version.
                echo "No existing data.json on gh-pages; pushing run snapshot."
              else
                retry_reason="could not read gh-pages data.json: $(cat /tmp/ghpages_read_err.txt)"
              fi
            fi

            # Never commit this run's (possibly stale) snapshot against a newer
            # branch head: if the current data could not be read and merged,
            # retry with fresh state and abort rather than risk reverting a
            # concurrent run's updates.
            if [ -n "$retry_reason" ]; then
              echo "Attempt $attempt: $retry_reason"
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Giving up after 3 attempts: $retry_reason"
                exit 1
              fi
              sleep 3
              continue
            fi

            # Safety net: never push an empty or garbled data.json. If the
            # encoding pipeline failed silently somewhere above, fail loudly
            # here instead of corrupting the dashboard.
            echo "$ADDITIONS" | jq -e '(.[0].contents | @base64d | fromjson | type) == "object"' > /dev/null

            VARIABLES=$(jq -n \
                --arg repo "$REPO" \
                --arg oid "$BRANCH_SHA" \
                --arg msg "chore: update PR metrics for $TODAY" \
                --argjson additions "$ADDITIONS" \
                '{input: {
                  branch: {repositoryNameWithOwner: $repo, branchName: "gh-pages"},
                  message: {headline: $msg},
                  fileChanges: {additions: $additions},
                  expectedHeadOid: $oid
                }}')

            # gh api graphql treats each -f field as an individual GraphQL
            # variable, so the payload must be sent as a full request body
            # via --input (variables as a JSON string is silently ignored).
            if output=$(jq -n \
                --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
                --argjson variables "$VARIABLES" \
                '{query: $query, variables: $variables}' \
                | gh api graphql --input - 2>&1); then
              echo "Pushed verified commit to gh-pages"
              break
            fi

            echo "Attempt $attempt failed: $output"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to push to gh-pages after 3 attempts. Last error: $output"
              exit 1
            fi
            sleep 3
          done
